name: ACPro Meta Webhook security tests
on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/test-acpro-meta-webhook.yml'
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/test-acpro-meta-webhook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP syntax
        run: |
          php -l automation/api/ig-webhook.php
          php -l automation/api/ig-relay.php
          php -l automation/config.example.php
      - name: Verify webhook handshake and signature
        run: python3 automation/tests/test_webhook.py -v
      - name: Parse Windows permanent Direct agent
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./automation/windows/ACPRO_DIRECT_POLL.ps1).Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw 'PowerShell parser reported errors'
          }
